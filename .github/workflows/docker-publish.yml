name: Docker 镜像构建与发布

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "可选镜像标签，留空时使用 latest"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: 构建并发布多架构镜像
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v6

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Sub2API 二次开发版 AI API 网关平台

      - name: 解析应用版本
        id: app-version
        shell: bash
        run: |
          VERSION="${{ inputs.tag }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(tr -d '\r\n' < backend/cmd/server/VERSION)
          fi
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "应用版本：$VERSION"

      - name: 构建并发布镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=${{ steps.app-version.outputs.version }}
            GOPROXY=https://goproxy.cn,direct
            GOSUMDB=sum.golang.google.cn
          cache-from: type=gha,scope=sub2api-docker
          cache-to: type=gha,mode=max,scope=sub2api-docker

      - name: 输出镜像信息
        run: |
          echo "已发布镜像：${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "标签："
          echo "${{ steps.meta.outputs.tags }}"
